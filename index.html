<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人简历</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    background-color:#f7f9fc;
    font-family:"Microsoft YaHei",sans-serif;
    padding:40px 20px;
}
.card{
    width:100%;
    max-width:600px;
    margin:0 auto;
    background:#fff;
    padding:40px 30px;
    border-radius:18px;
    box-shadow:0 8px 24px rgba(0,0,0,0.08);
    text-align:center;
}
h1{
    color:#222;
    font-size:32px;
    margin-bottom:24px;
}
img{
    width:260px;
    border-radius:14px;
    box-shadow:0 4px 14px rgba(0,0,0,0.12);
    margin-bottom:30px;
}
.info{
    text-align:left;
    line-height:2;
    font-size:16px;
    color:#444;
}
.info h3{
    color:#2c5282;
    margin:16px 0 8px;
    border-left:4px solid #3b82f6;
    padding-left:10px;
}
</style>
</head>
<body>
<div class="card">
    <h1>梁静诗</h1>
    <img src="me.jpg" alt="照片">
    <div class="info">
        <h3>基本信息</h3>
        <p>姓名：梁静诗</p>
        <p>学历：大专</p>
        <p>专业：大模型应用开发</p>
        <p>学校：广东科学技术职业学院</p>

        <h3>技能</h3>
        <p>Python、HTML/CSS、JS、大模型应用开发</p>

        <h3>自我评价</h3>
        <p>学习能力强，热爱前端与AI应用开发，愿意持续学习新技术。</p>
    </div>
</div>
</body>
</html>
